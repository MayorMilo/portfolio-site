<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew — Projects</title>
<meta name="description" content="A working catalog of apps and tools built by Andrew.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav wrap" aria-label="Site sections">
    <a class="nav-btn is-active" href="./" aria-current="page">Code/Apps</a>
    <a class="nav-btn" href="https://andrewpengart.com">Art/Design</a>
  </nav>
  <div class="wrap header-grid">
    <h1 class="wordmark">Andrew<span class="wordmark-dot">.</span></h1>
    <p class="intro">
      A working catalog of the apps and tools I've built — some runnable right here,
      others packaged as downloads. Source is linked for all of them.
    </p>
  </div>
</header>

<main class="wrap">
  <section class="controls" aria-label="Filter projects">
    <button class="filter-btn is-active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="live">Live demo</button>
    <button class="filter-btn" data-filter="download">Download</button>
  </section>

  <section id="grid" class="grid" aria-live="polite">
    <!-- Cards are rendered here by app.js from projects.js -->
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-grid">
    <p>Built and deployed with GitHub Pages.</p>
    <nav class="footer-links">
      <a href="https://github.com/YOUR-USERNAME" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:you@example.com">Email</a>
    </nav>
  </div>
</footer>

<script src="projects.js"></script>
<script src="app.js"></script>
</body>
</html>
